name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # web/ 自带 eslint.config.js，且根配置已排除 web/**，必须单独跑一遍
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 代码检查
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # web/ 不在根 workspaces 里（自带 Vue 工具链与独立 lock），按独立项目安装后再检查
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 类型检查
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run check:progress
      - run: npm run test
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 测试
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run test
