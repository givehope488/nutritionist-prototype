name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # web/ 自带 eslint.config.js，且根配置已排除 web/**，必须单独跑一遍
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 代码检查
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # web/ 不在根 workspaces 里（自带 Vue 工具链与独立 lock），按独立项目安装后再检查
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 类型检查
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:data
      - run: npm run check:progress
      - run: npm run test
      # 端点契约 smoke：逐条打真实 HTTP 断言。此前只在本地 `npm run check` 里跑，
      # CI 是分命令执行的（不走 check），所以这些断言一次都没被门禁覆盖过。
      # 用 hashFiles 门控：脚本与 npm 命令由 PR #18 引入，主干上还没有，
      # 写死会让所有 PR 在这一步直接红；PR #18 合并后自动生效，不需要再改。
      - name: 端点契约 smoke
        if: hashFiles('server/scripts/smoke.ts') != ''
        run: npm run smoke
      - name: web 依赖
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm ci
      - name: web 测试
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: npm run test
