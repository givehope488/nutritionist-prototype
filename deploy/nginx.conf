# 食堂营养师 —— nginx 配置（W3-C1 的「反代」那一件）
#
# 一个容器干两件事：
#   1. 静态站：/usr/share/nginx/html（vite build 产物），SPA 路由回落到 index.html
#   2. 反向代理：/api/* 与 /healthz 转发给 server:8787（compose 里的服务名）
#
# 为什么不在 server 里开 CORS：同源部署时前端请求 /api/v1/...，浏览器视角与页面同源，
# 不需要 CORS，也不会因为漏配 Origin 而在某些浏览器上静默失败。

upstream canteen_server {
    server server:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本
    server_tokens off;

    # 上传体积上限与 Express 侧保持一致（express.json 限 256kb，这里放宽到 1m 留余量）
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- 健康检查：直接透传到后端，方便外部探针按 200/非 200 判断 ----
    location = /healthz {
        proxy_pass http://canteen_server/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://canteen_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 静态资源：带 hash 的产物长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 路由回落（/profile、/recommend 等前端路由刷新不 404） ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
